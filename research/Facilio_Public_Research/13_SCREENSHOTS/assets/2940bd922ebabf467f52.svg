<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 235" width="260" height="235" role="img" aria-label="An Emirates ID card being inserted into a card reader">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3fb"/>
      <stop offset="1" stop-color="#d9e3f4"/>
    </linearGradient>
    <linearGradient id="readerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37455e"/>
      <stop offset="1" stop-color="#283648"/>
    </linearGradient>
  </defs>

  <style>
    .card { animation: insert 3.4s ease-in-out infinite; }
    @keyframes insert {
      0%   { transform: translateY(-60px); }
      22%  { transform: translateY(20px); }
      48%  { transform: translateY(20px); }
      70%  { transform: translateY(-60px); }
      100% { transform: translateY(-60px); }
    }
    .led  { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { fill:#5b6b82; } 50% { fill:#33d17a; } }
    .halo { animation: halo 1.6s ease-in-out infinite; }
    @keyframes halo { 0%,100% { opacity:0; } 50% { opacity:.5; } }
  </style>

  <!-- Card (drawn first so the reader covers its lower part when inserted) -->
  <g class="card">
    <rect x="54" y="64" width="152" height="96" rx="9" fill="url(#cardGrad)" stroke="#c7d3e6"/>
    <text x="67" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="0.6" fill="#607796">UAE · EMIRATES ID</text>
    <rect x="170" y="86" width="28" height="34" rx="4" fill="#b9c6da"/>
    <rect x="68" y="102" width="24" height="18" rx="4" fill="#cbb26a"/>
    <rect x="68" y="126" width="96" height="5" rx="3" fill="#aebfd6"/>
    <rect x="68" y="136" width="70" height="5" rx="3" fill="#aebfd6"/>
    <rect x="68" y="146" width="54" height="5" rx="3" fill="#aebfd6"/>
  </g>

  <!-- Reader -->
  <g>
    <rect x="38" y="118" width="184" height="110" rx="15" fill="url(#readerGrad)"/>
    <rect x="53" y="130" width="154" height="11" rx="6" fill="#10171f"/>
    <text x="54" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" letter-spacing="1.5" fill="#9fb0c9">CARD READER</text>
    <circle class="halo" cx="200" cy="212" r="10" fill="#33d17a"/>
    <circle class="led" cx="200" cy="212" r="5" fill="#5b6b82"/>
  </g>
</svg>
