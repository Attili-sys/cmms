# For an app kept in a GitHub repository: secrets, the linter and the tests on every pull request.
# `canvas validate` is not here — it needs the company network to install canvas; run it locally.
# Actions are pinned to a commit, not a tag a maintainer can move; the tag is beside it.
name: ci
on: [pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same gitleaks as .pre-commit-config.yaml, here because the hook is opt-in.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # uv takes Python from .python-version — the platform's, the one the build uses — never the runner's.
      # --locked: what uv.lock says, or fail — never a quietly re-resolved dependency.
      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest
